# MUP default menu
#
# This is an example menu. Edit it, or create .mup/mup-menu.conf in a project
# to give that project its own menu. See the README for the full format.

[Git: Status]
exec=git status
help=working tree status

[Git: Recent commits]
exec=git log --oneline --graph --decorate -20
help=last 20 commits

[Git: Pull]
exec=git pull --ff-only
help=update the current branch

[Files: List this directory]
exec=ls -lah
help=everything here, including hidden files

[Files: Biggest items here]
exec=du -sh -- * .[!.]* 2>/dev/null | sort -rh | head -20
help=top 20 by size

[System: Disk usage]
exec=df -h
help=free space on each drive

[Show date and time]
exec=date
callback=read -r -p "Press enter to return to the menu..." _ && "$0"
help=example of a callback that returns to the menu
